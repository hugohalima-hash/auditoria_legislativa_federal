name: Comparação documental federal
on:
  workflow_run:
    workflows: ['Inventário documental federal']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de uma execução concluída do inventário'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: comparacao-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  comparar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar comparador
        run: python -m unittest discover -s tests -v
      - name: Recuperar inventário preservado
        uses: actions/download-artifact@v4
        with:
          name: inventario-federal-${{ github.event.workflow_run.id || inputs.run_id }}
          path: resultados/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
      - name: Comparar artigos e gerar visão lado a lado
        run: python scripts/comparar.py
      - name: Preservar comparação e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacao-federal-${{ github.run_id }}
          path: resultados/comparacao/
          retention-days: 90
          if-no-files-found: warn
      - name: Resumo verificável
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status=json.loads(Path('resultados/comparacao/cobertura_comparacao.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('# Comparativo documental disponível\n\n')
              out.write('O artefato contém comparativo.html, candidatos, base pesquisável e cobertura.\n\n')
              out.write('**Triagem automática; análise jurídica e conferência oficial pendentes.**\n\n')
              out.write('```json\n'+json.dumps(status,ensure_ascii=False,indent=2)+'\n```\n')
          PY
